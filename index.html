<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>weather app - tr5</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="weather-app">

            <header class="header">
                <h1>🌤️ weather app</h1>
                <p>cek kondisi cuaca berdasarkan kota</p>
            </header>

            <!--Form pencarian -->
            <form id="weatherForm" class="search-form">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Masukkan nama kota..."
                    autocomplate="off"
                    required
                    >
                
                <button type="submit">
                    cari
                </button>

            </form>

            <!--toggle celsius/Fahrenheit-->
            <div class="temperature-toggle">
                <span>satuan:</span>

                <button id="celsiusBtn" class="active">
                    °C
                </button>

                <button id="fahrenheitBtn">
                    °F
                </button>
            </div>

            <!--Loading-->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>mengambil data cuaca...</p>
            </div>

            <!--Error-->
            <div id="errorMessage" class="error hidden">
                <P id="errorText"></P>
            </div>

            <!--Hasil cuaca-->
            <section id="weatherResult" class="weather-card hidden">

                <div class="weather-location">
                    <h2 id="cityName">Medan</h2>
                    <p id="countryName">Indonesia</p>
                </div>

                <div class="weather-main">

                    <img
                        id="weatherIcon"
                        src=""
                        alt="Icon cuaca"
                    >

                    <div>
                        <h3 id="temperature">--°C</h3>
                        <p id="description">--</p>
                    </div>

                </div>

                <div class="weather-info">
                    <div class="info-box">
                        <span>💧</span>
                        <p>Kelembapan</p>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="info-box">
                        <span>🌡️</span>
                        <p>Terasa seperti</p>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                    <div class="info-box">
                        <span>💨</span>
                        <p>kecepatan Angin</p>
                        <strong id="windSpeed">--m/s</strong>
                    </div>

                </div>

            </section>

            <!--riwayat pencarian-->
            <section class="history-section">

                <h2>🕘Riwayat Pencarian</h2>

                <div id="historyList" class="history-list">
                    <p class="empty-history">
                        belum ada riwayat pencarian.
                    </p>
                </div>

            </section>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
